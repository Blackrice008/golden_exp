<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezzo Oro in Tempo Reale & Simulatore</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0c0d14; color: #fff; margin: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1400px; margin: 0 auto; }
        
        /* ALTEZZA BLOCCATA IN PIXEL PER EVITARE IL COLLASSO A ZERO */
        .chart-box { flex: 2; min-width: 350px; height: 500px; background: #131722; border-radius: 8px; border: 1px solid #2a2e39; }
        .panel-box { flex: 1; min-width: 300px; background: #131722; padding: 25px; border-radius: 8px; border: 1px solid #2a2e39; box-sizing: border-box; }
        
        h1 { color: #f39c12; font-size: 1.8em; margin-bottom: 20px; }
        h2 { color: #f39c12; margin-top: 0; font-size: 1.4em; }
        label { display: block; margin: 15px 0 5px; color: #b2b5be; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #363c4e; background: #1e222d; color: #fff; box-sizing: border-box; font-size: 1em; }
        input:focus { border-color: #f39c12; outline: none; }
        .btn-container { display: flex; gap: 10px; }
        .btn-long { background: #26a69a; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-long:hover { background: #2bbbad; }
        .btn-short { background: #ef5350; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-short:hover { background: #f44336; }
        .btn-close { background: #78909c; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-close:hover { background: #90a4ae; }
        .position-card { background: #1e222d; padding: 15px; border-radius: 6px; margin-top: 15px; display: none; border-left: 5px solid #78909c; }
        .pos-active { font-weight: bold; font-size: 1.1em; margin-top: 0; }
        .profit { color: #26a69a; font-weight: bold; }
        .loss { color: #ef5350; font-weight: bold; }
        .info-text { font-size: 0.85em; color: #787b86; margin-top: -10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<h1>📈 Quotazione Oro Spot (XAU/USD) & Simulatore Posizioni</h1>

<div class="container">
    <!-- 1. GRAFICO CON ALTEZZA INTERNA COSTRRETTA IN PIXEL -->
    <div class="chart-box">
        <div class="tradingview-widget-container" style="height:100%; width:100%;">
            <div class="tradingview-widget-container__widget" style="height:100%; width:100%;"></div>
            <script type="text/javascript" src="https://tradingview.com" async>
            {
                "width": "100%",
                "height": "100%",
                "symbol": "TVC:GOLD",
                "interval": "5",
                "timezone": "Europe/Rome",
                "theme": "dark",
                "style": "1",
                "locale": "it",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "calendar": false,
                "support_host": "https://tradingview.com"
            }
            </script>
        </div>
    </div>

    <!-- 2. PANNELLO SIMULATORE -->
    <div class="panel-box">
        <h2>Simulatore Posizione</h2>
        <p class="info-text">Guarda il prezzo attuale sul grafico a sinistra e inserisci i dati per simulare.</p>
        
        <div id="setupOrder">
            <label for="entryPrice">Prezzo di Ingresso (USD)</label>
            <input type="number" id="entryPrice" placeholder="Es. 2650.50" step="0.01">

            <label for="investAmount">Capitale da Investire (\$ USD)</label>
            <input type="number" id="investAmount" placeholder="Es. 1000" min="1">

            <div class="btn-container">
                <button class="btn-long" onclick="apriPosizione('LONG')">🟢 COMPRA (Long)</button>
                <button class="btn-short" onclick="apriPosizione('SHORT')">🔴 VENDI (Short)</button>
            </div>
        </div>

        <div id="activePosition" class="position-card">
            <p class="pos-active" id="posType">TIPO POSIZIONE</p>
            <p>Prezzo Ingresso: <span id="posEntry">-</span> USD</p>
            <p>Capitale Investito: \$<span id="posCapital">-</span></p>
            
            <label for="currentPriceInput" style="color: #f1c40f; font-weight: bold;">Prezzo Corrente del Mercato:</label>
            <input type="number" id="currentPriceInput" placeholder="Inserisci il prezzo che vedi sul grafico" step="0.01" oninput="aggiornaLive()">

            <p>Valore Attuale: <span id="posCurrentValue">-</span></p>
            <p>Profitto/Perdita (P&L): <span id="posPnL">-</span></p>
            <button class="btn-close" onclick="chiudiPosizione()">❌ Chiudi Posizione</button>
        </div>
    </div>
</div>

<script>
let posizioneAttiva = null;

function apriPosizione(direzione) {
    const entry = parseFloat(document.getElementById('entryPrice').value);
    const capitale = parseFloat(document.getElementById('investAmount').value);

    if (isNaN(entry) || entry <= 0 || isNaN(capitale) || capitale <= 0) {
        alert("Inserisci valori validi.");
        return;
    }

    posizioneAttiva = { tipo: direzione, prezzoIngresso: entry, capitaleIniziale: capitale };

    document.getElementById('setupOrder').style.display = 'none';
    const card = document.getElementById('activePosition');
    card.style.display = 'block';
    card.style.borderLeft = direzione === 'LONG' ? '5px solid #26a69a' : '5px solid #ef5350';
    
    document.getElementById('posType').innerText = direzione === 'LONG' ? '🟢 POSIZIONE LONG APERTA' : '🔴 POSIZIONE SHORT APERTA';
    document.getElementById('posEntry').innerText = entry.toFixed(2);
    document.getElementById('posCapital').innerText = capitale.toFixed(2);
    document.getElementById('currentPriceInput').value = entry;
    
    aggiornaLive();
}

function aggiornaLive() {
    if (!posizioneAttiva) return;
    const livePrice = parseFloat(document.getElementById('currentPriceInput').value);
    if (isNaN(livePrice) || livePrice <= 0) return;

    let pnlPercentuale = posizioneAttiva.tipo === 'LONG' ? 
        (livePrice - posizioneAttiva.prezzoIngresso) / posizioneAttiva.prezzoIngresso : 
        (posizioneAttiva.prezzoIngresso - livePrice) / posizioneAttiva.prezzoIngresso;

    const pnlDenaro = posizioneAttiva.capitaleIniziale * pnlPercentuale;
    const valoreAttuale = posizioneAttiva.capitaleIniziale + pnlDenaro;

    document.getElementById('posCurrentValue').innerText = `$${valoreAttuale.toFixed(2)}`;
    const pnlBox = document.getElementById('posPnL');
    
    if (pnlDenaro >= 0) {
        pnlBox.className = 'profit'; pnlBox.innerText = `+$${pnlDenaro.toFixed(2)} (+${(pnlPercentuale * 100).toFixed(2)}%)`;
    } else {
        pnlBox.className = 'loss'; pnlBox.innerText = `-$${Math.abs(pnlDenaro).toFixed(2)} (${(pnlPercentuale * 100).toFixed(2)}%)`;
    }
}

function chiudiPosizione() {
    alert(`Posizione chiusa! Risultato finale: ${document.getElementById('posPnL').innerText}`);
    posizioneAttiva = null;
    document.getElementById('activePosition').style.display = 'none';
    document.getElementById('setupOrder').style.display = 'block';
    document.getElementById('entryPrice').value = '';
    document.getElementById('investAmount').value = '';
}
</script>

</body>
</html>
