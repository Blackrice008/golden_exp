<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore Trading Oro - Realtime</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #131722; color: #fff; margin: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; }
        .chart-box { flex: 2; min-width: 320px; height: 450px; background: #1c2030; padding: 15px; border-radius: 8px; box-sizing: border-box; }
        .panel-box { flex: 1; min-width: 300px; background: #1c2030; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); box-sizing: border-box; }
        h1 { color: #f39c12; font-size: 1.8em; }
        h2 { color: #f39c12; margin-top: 0; }
        .ticker { font-size: 1.3em; font-weight: bold; color: #f1c40f; margin-bottom: 15px; background: #2a2e39; padding: 10px; border-radius: 4px; text-align: center; }
        label { display: block; margin: 10px 0 5px; color: #b2b5be; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #363c4e; background: #2a2e39; color: #fff; box-sizing: border-box; font-size: 1em; }
        .btn-container { display: flex; gap: 10px; }
        .btn-long { background: #26a69a; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-long:hover { background: #2bbbad; }
        .btn-short { background: #ef5350; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-short:hover { background: #f44336; }
        .btn-close { background: #78909c; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-close:hover { background: #90a4ae; }
        .position-card { background: #2a2e39; padding: 15px; border-radius: 6px; margin-top: 15px; border-left: 5px solid #78909c; }
        .pos-active { font-weight: bold; font-size: 1.1em; }
        .profit { color: #26a69a; }
        .loss { color: #ef5350; }
        #customChart { background-color: #1c2030; border: 1px solid #2a2e39; border-radius: 4px; display: block; }
    </style>
</head>
<body>

<h1>📈 Analisi Finanziaria & Simulatore Oro (Dati Reali)</h1>
<p>Grafico e simulatore nativi indipendenti alimentati dal feed Swissquote XAU/USD.</p>

<div class="container">
    <div class="chart-box">
        <!-- Canvas indipendente con dimensioni esplicite -->
        <canvas id="customChart" width="600" height="400" style="width:100%; height:100%;"></canvas>
    </div>

    <div class="panel-box">
        <h2>Simulatore Spot</h2>
        <div class="ticker" id="priceBox">Prezzo Oro: Caricamento...</div>
        
        <div id="setupOrder">
            <label for="investAmount">Capitale da Investire (\$ USD)</label>
            <input type="number" id="investAmount" placeholder="Es. 1000" min="1" step="10">

            <div class="btn-container">
                <button class="btn-long" onclick="apriPosizione('LONG')">🟢 COMPRA (Long)</button>
                <button class="btn-short" onclick="apriPosizione('SHORT')">🔴 VENDI (Short)</button>
            </div>
        </div>

        <div id="activePosition" class="position-card" style="display: none;">
            <p class="pos-active" id="posType">Tipo: -</p>
            <p>Prezzo Ingresso: <span id="posEntry">-</span> USD</p>
            <p>Capitale Investito: \$<span id="posCapital">-</span></p>
            <p>Valore Attuale Posizione: <span id="posCurrentValue" style="font-weight: bold;">-</span></p>
            <p>Profitto/Perdita (P&L): <span id="posPnL" style="font-weight: bold;">-</span></p>
            <button class="btn-close" onclick="chiudiPosizione()">❌ Chiudi Posizione</button>
        </div>
    </div>
</div>

<script>
let currentPrice = 0;
let posizioneAttiva = null;
const priceHistory = [];
const maxPoints = 30;

const canvas = document.getElementById('customChart');
const ctx = canvas.getContext('2d');

function disegnaGrafico() {
    if (priceHistory.length < 2) return;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const minPrice = Math.min(...priceHistory) * 0.9998;
    const maxPrice = Math.max(...priceHistory) * 1.0002;
    const priceRange = maxPrice - minPrice;
    const stepX = canvas.width / (priceHistory.length - 1);
    
    // Griglia di sfondo
    ctx.strokeStyle = '#2a2e39';
    ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
        let y = (canvas.height / 5) * i;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Linea andamento prezzo
    ctx.beginPath();
    ctx.strokeStyle = '#f39c12';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    
    for (let i = 0; i < priceHistory.length; i++) {
        const x = i * stepX;
        const y = canvas.height - ((priceHistory[i] - minPrice) / priceRange) * canvas.height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();
    
    // Testo prezzo
    ctx.fillStyle = '#f1c40f';
    ctx.font = '14px Arial';
    const lastY = canvas.height - ((priceHistory[priceHistory.length - 1] - minPrice) / priceRange) * canvas.height;
    ctx.fillText(`$${currentPrice.toFixed(2)}`, canvas.width - 90, lastY - 10);
}

async function fetchRealGoldPrice() {
    try {
        const response = await fetch('https://swissquote.com');
        const data = await response.json();
        
        if(data && data.topoProfile) {
            const bid = data.topoProfile.bidPrice;
            const ask = data.topoProfile.askPrice;
            currentPrice = (bid + ask) / 2;

            document.getElementById('priceBox').innerText = `Prezzo Oro: $${currentPrice.toFixed(2)} / oz`;
            
            if (priceHistory.length >= maxPoints) priceHistory.shift();
            priceHistory.push(currentPrice);
            
            disegnaGrafico();
            if (posizioneAttiva) aggiornaMetrichePosizione();
        }
    } catch (error) {
        console.error("Errore di caricamento dati:", error);
    }
}

function apriPosizione(direzione) {
    const capitale = parseFloat(document.getElementById('investAmount').value);
    if (isNaN(capitale) || capitale <= 0) return alert("Inserisci un importo valido.");
    if (currentPrice === 0) return alert("Attendi la sincronizzazione del prezzo.");

    posizioneAttiva = { tipo: direzione, prezzoIngresso: currentPrice, capitaleIniziale: capitale };

    document.getElementById('setupOrder').style.display = 'none';
    const card = document.getElementById('activePosition');
    card.style.display = 'block';
    card.style.borderLeft = direzione === 'LONG' ? '5px solid #26a69a' : '5px solid #ef5350';
    document.getElementById('posType').innerText = direzione === 'LONG' ? '🟢 POSIZIONE LONG ATTIVA' : '🔴 POSIZIONE SHORT ATTIVA';
    document.getElementById('posEntry').innerText = posizioneAttiva.prezzoIngresso.toFixed(2);
    document.getElementById('posCapital').innerText = posizioneAttiva.capitaleIniziale.toFixed(2);
    aggiornaMetrichePosizione();
}

function aggiornaMetrichePosizione() {
    if (!posizioneAttiva) return;
    let pnlPercentuale = posizioneAttiva.tipo === 'LONG' ? 
        (currentPrice - posizioneAttiva.prezzoIngresso) / posizioneAttiva.prezzoIngresso : 
        (posizioneAttiva.prezzoIngresso - currentPrice) / posizioneAttiva.prezzoIngresso;

    const pnlDenaro = posizioneAttiva.capitaleIniziale * pnlPercentuale;
    const valoreAttuale = posizioneAttiva.capitaleIniziale + pnlDenaro;

    const pnlBox = document.getElementById('posPnL');
    const valBox = document.getElementById('posCurrentValue');
    valBox.innerText = `$${valoreAttuale.toFixed(2)}`;
    
    if (pnlDenaro >= 0) {
        pnlBox.className = 'profit'; pnlBox.innerText = `+$${pnlDenaro.toFixed(2)} (+${(pnlPercentuale * 100).toFixed(2)}%)`;
        valBox.className = 'profit';
    } else {
        pnlBox.className = 'loss'; pnlBox.innerText = `-$${Math.abs(pnlDenaro).toFixed(2)} (${(pnlPercentuale * 100).toFixed(2)}%)`;
        valBox.className = 'loss';
    }
}

function chiudiPosizione() {
    alert(`Posizione chiusa! Risultato finale: ${document.getElementById('posPnL').innerText}`);
    posizioneAttiva = null;
    document.getElementById('activePosition').style.display = 'none';
    document.getElementById('setupOrder').style.display = 'block';
}

// Inizializzazione corretta senza blocchi asincroni di primo livello
function avviaApplicazione() {
    fetchRealGoldPrice().then(() => {
        if(currentPrice > 0) {
            // Genera uno storico iniziale per popolare immediatamente la visualizzazione
            for(let i=0; i<15; i++) {
                priceHistory.push(currentPrice + (Math.random() - 0.5) * 0.3);
            }
            disegnaGrafico();
        }
        // Avvia il timer di aggiornamento continuo ogni 3 secondi
        setInterval(fetchRealGoldPrice, 3000);
    });
}

// Avvia l'app al caricamento della pagina
window.onload = avviaApplicazione;
</script>

</body>
</html>
